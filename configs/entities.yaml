# Entity normalization and confusable-entity rules. Edit HERE to extend coverage; no code change.
# Override path with LITBIORAG_ENTITIES_CONFIG. Everything is lower-cased and stripped of
# non-alphanumerics before matching ("Type 2 Diabetes" -> "type2diabetes").
#
# A *near neighbour* is a different entity that is easy to confuse with the one the question asked
# about. If a critical claim names a near neighbour and no critical claim names the asked entity,
# the answer is a substitution and the gate abstains. Rules (all applied, any hit counts):
#   1. numbered family: same text once digits are removed, digits differ   (MAP3K3/MAP3K7, IL6/IL17,
#      CD4/CD8, HER2/HER3, type1diabetes/type2diabetes, trisomy21/trisomy18, COX1/COX2, BRCA1/BRCA2)
#   2. letter variant: edit distance 1 on names of 4+ chars              (hepatitisb/hepatitisc)
#   3. small edit on the same alphabetic stem (distance <= 2)             (MAPK3/MAP3K3)
#   4. antonym prefix swap                                                (hypo/hyper, brady/tachy)
#   5. shared drug-class suffix (INN stem)                                (atorvastatin/simvastatin)
#   6. explicit confusable group below                                    (hydroxyzine/hydralazine)

