# Model registry. Change models HERE (or with LITBIORAG_MODEL__<ROLE>=kind:model[@rev]?k=v),
# never in code. Each role is built by an adapter keyed by `kind`; see models/registry/README.md.
#
# Rules enforced at load time:
#   * generator, verifier and offline_judge must come from different model families;
#   * thresholds are valid only for the model id they were calibrated on (calibration.for_model);
#     a swapped model has no thresholds until the calibration job records new ones.
# The dense encoder is pinned by the bundle: changing it means re-embedding on the build host.

default_profile: test

profiles:

  test:
    description: Deterministic doubles so CI and the demo pipeline run without model weights.
    require_calibrated: false
    models:
      dense_encoder: hash:128
      reranker: lexical:overlap
      generator: template:evidence-extractive
      verifier: overlap:negation-aware
      entity_extractor: regex:biomed-v2

  thesis-baseline:
    description: >
      The thesis models, reimplemented behind the v2 pipeline (single-stage reranker, token-level
      truncation). Used only for the thesis-equivalent production baseline in BASELINE_RESULTS.md.
      Generator/verifier families differ (qwen vs deberta), so the independence rule holds.
    require_calibrated: false   # baseline run reports raw signals; no delivery decisions
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64}  # paired towers
      reranker:
        kind: hf_seq_cls
        model_id: ncbi/MedCPT-Cross-Encoder
        max_tokens: 512
        params: {batch_size: 32, dtype: float16}
      generator:
        kind: hf_causal
        model_id: Qwen/Qwen2.5-3B-Instruct
        quantization: 4bit
        max_tokens: 512
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
        max_tokens: 512
      entity_extractor: regex:biomed-v2

  hosted:
    description: >
      Hosted generator behind an API key (owner decision 2026-10-31), local small models for the
      rest so no GPU is needed for the generator. Any /v1/chat/completions server works: set
      endpoint + api_key_env, or override with
      LITBIORAG_MODEL__GENERATOR="openai_compatible:<model>?endpoint=<url>&api_key_env=<VAR>".
      Spend is capped by configs/resources.yaml (api.max_usd_per_request / max_usd_per_day) and
      every call is written to the usage ledger. Candidate model ids are placeholders until
      docs/MODEL_SELECTION.md records the benchmark.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64}  # paired towers
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16}
      generator:
        kind: openai_compatible
        model_id: gpt-4o-mini                          # placeholder candidate; owner's key
        endpoint: https://api.openai.com/v1
        api_key_env: OPENAI_API_KEY
        max_tokens: 1024
        params: {timeout_s: 60, max_retries: 3, backoff_s: 2.0, json_mode: "true"}
      # alternative (same role, swap by config only):
      #   generator: {kind: anthropic, model_id: claude-sonnet-5-5, api_key_env: ANTHROPIC_API_KEY}
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        max_tokens: 512
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2

  offline-demo:
    description: >
      Real but small CPU models for an offline demonstration on a VPS without a GPU: MiniLM
      encoder and reranker, Qwen2.5-0.5B generator, DeBERTa-v3-base verifier. NOT medically
      reliable and NOT calibrated; exists so a client can see real generation (not doubles) on
      their own slides. Weights are prefetched by scripts/model_cache.py.
    require_calibrated: false
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: sentence-transformers/all-MiniLM-L6-v2
        max_tokens: 256
      reranker:
        kind: hf_seq_cls
        model_id: cross-encoder/ms-marco-MiniLM-L-6-v2
        max_tokens: 512
        params: {batch_size: 8, dtype: float32}
      generator:
        kind: hf_causal
        model_id: Qwen/Qwen2.5-0.5B-Instruct
        max_tokens: 512
        params: {dtype: float32}
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
        max_tokens: 512
        params: {batch_size: 4, dtype: float32}
      entity_extractor: regex:biomed-v2

  cloud-anthropic:
    description: >
      Hosted Anthropic generator with the same biomedical retrieval and large local verifier as
      `hosted` (a cloud generator never downgrades retrieval or verification). Model id is a
      placeholder until MODEL_SELECTION.md records a benchmark; key from ANTHROPIC_API_KEY.
      Sends question + evidence excerpts to the provider: requires content-owner authorization.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64}
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16}
      generator:
        kind: anthropic
        model_id: claude-sonnet-5-5
        api_key_env: ANTHROPIC_API_KEY
        max_tokens: 1024
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        max_tokens: 512
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2

  cloud-deepseek:
    description: >
      Hosted DeepSeek generator (OpenAI-compatible endpoint) with the `hosted` retrieval and
      verifier; model id is a placeholder to verify against the provider catalog; key from
      DEEPSEEK_API_KEY. Same authorization requirement as cloud-anthropic.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64}
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16}
      generator:
        kind: openai_compatible
        model_id: deepseek-chat
        endpoint: https://api.deepseek.com/v1
        api_key_env: DEEPSEEK_API_KEY
        max_tokens: 1024
        params: {timeout_s: 90, max_retries: 3, backoff_s: 2.0, json_mode: "true"}
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        max_tokens: 512
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2

  local-8b:
    description: >
      Profile A — local prototype on one 12 GB GPU: paired MedCPT retrievers, bge-reranker-v2-m3,
      Qwen3-8B at 4-bit (thinking off, repetition controls from app/generation/profiles.py),
      DeBERTa-v3-large NLI verifier. Candidates until MODEL_SELECTION.md records the benchmark.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64, vram_gb: 0.5}
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16, vram_gb: 1.2}
      generator:
        kind: hf_causal
        model_id: Qwen/Qwen3-8B
        quantization: 4bit
        max_tokens: 1024
        params: {dtype: bfloat16, vram_gb: 6.0}
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        max_tokens: 512
        params: {vram_gb: 1.0}
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2

  vllm-8b:
    description: >
      Profile A served by vLLM (compose.gpu-vllm.yaml): the same retrieval, reranker and verifier
      as local-8b stay in the API process; the generator is Qwen3-8B (AWQ 4-bit) behind vLLM's
      OpenAI-compatible endpoint on the same GPU host. vLLM batches concurrent requests
      (continuous batching, paged KV cache), so resources.yaml concurrency.roles.generator.capacity
      can be raised to the server's --max-num-seqs instead of 1. Endpoint via VLLM_URL
      (default http://vllm:8000/v1); an optional bearer token via VLLM_API_KEY. No API spend: the
      ledger records tokens with zero cost unless pricing.yaml prices the model id.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64, vram_gb: 0.5}
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16, vram_gb: 1.2}
      generator:
        kind: openai_compatible
        model_id: Qwen/Qwen3-8B-AWQ
        endpoint: http://vllm:8000/v1              # override: LITBIORAG_MODEL__GENERATOR=... or VLLM_URL
        api_key_env: VLLM_API_KEY
        max_tokens: 1024
        params: {timeout_s: 120, max_retries: 2, backoff_s: 1.0, json_mode: "true"}
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        max_tokens: 512
        params: {vram_gb: 1.0}
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2

  local-14b:
    description: >
      Profile B — higher-quality local: same retrieval and verifier as local-8b with Qwen3-14B at
      4-bit. Needs ~9.5 GB for the generator; on a 12 GB card it must run on_demand (resources.yaml)
      or on a second GPU (device: cuda:1). Benchmark against local-8b on the same slides, evidence
      spans and question set.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64, vram_gb: 0.5}
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16, vram_gb: 1.2}
      generator:
        kind: hf_causal
        model_id: Qwen/Qwen3-14B
        quantization: 4bit
        max_tokens: 1024
        params: {dtype: bfloat16, vram_gb: 9.5}
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
        max_tokens: 512
        params: {vram_gb: 1.0}
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2

  default:
    description: >
      Production candidates sized for 12 GB VRAM. Every entry is a candidate until
      docs/MODEL_SELECTION.md records the benchmark that chose it; thresholds are empty until the
      calibration job writes them.
    require_calibrated: true
    models:
      dense_encoder:
        kind: sentence_transformers
        model_id: ncbi/MedCPT-Article-Encoder        # candidate; Step 5a benchmark decides
        max_tokens: 512
        params: {query: ncbi/MedCPT-Query-Encoder, query_max_tokens: 64}  # paired towers
      reranker:
        kind: hf_seq_cls
        model_id: BAAI/bge-reranker-v2-m3             # candidate; Step 5b
        max_tokens: 1024
        params: {batch_size: 16, dtype: float16}
      generator:
        kind: hf_causal
        model_id: Qwen/Qwen3-8B                       # candidate; Step 6 benchmark
        quantization: 4bit
        max_tokens: 1024
      verifier:
        kind: hf_seq_cls
        model_id: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli   # candidate; Step 7
        max_tokens: 512
        calibration:
          for_model: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
          thresholds: {}          # written by scripts/calibrate_gate.py (Step 8)
          validated_on: ""
          date: ""
      entity_extractor: regex:biomed-v2
      offline_judge:
        kind: openai_compatible
        model_id: gpt-4o-mini                         # evaluation only; never at runtime
        endpoint: https://api.openai.com/v1
        api_key_env: OPENAI_API_KEY
