# Human review queue: which gate outcomes go to a reviewer, and how a release is checked.
enqueue:
  actions: [ABSTAIN, ESCALATE]       # delivery actions that create a review case
  internal_states: [BLOCK]           # only when the internal gate state is BLOCK
  skip_reasons: [no_evidence, resource_limit]   # abstentions nobody can fix by review
expire_hours: 72                     # pending cases older than this are marked expired
db_path: data/review/review.sqlite
labels_path: data/audit/labels_from_review.jsonl   # released/blocked decisions as label records
reverify_on_release: true            # an edited release is re-verified; unsupported claims need confirm=true
