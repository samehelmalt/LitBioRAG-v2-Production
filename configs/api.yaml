# API service settings. Secrets never live here: they are read from the environment variables
# named below. Paths are relative to the repository root unless absolute.
bundle: ""                          # or LITBIORAG_BUNDLE
profile: ""                         # models.yaml profile; "" = file default (LITBIORAG_MODEL_PROFILE)
scope_profile: research             # research | education (affects the ESCALATE rules' wording)

auth:
  required: false                   # true in production: every request needs a JWT or API key
  jwt_secret_env: LITBIORAG_JWT_SECRET
  jwt_algorithms: [HS256]
  jwt_audience: litbiorag
  api_keys_env: LITBIORAG_API_KEYS  # comma-separated "key:subject" pairs for server-to-server use
  anonymous_courses: []             # course ids anonymous users may query (none by default)

limits:
  max_question_chars: 1000
  max_units: 12
  rate_per_minute: 30               # per principal (sub / api key / client ip)
  burst: 10
  max_upload_mb: 50
  max_files_per_kb: 500

audit:
  path: data/audit/requests.jsonl   # one JSON line per request; "" disables
  store_question_text: true         # false hashes the question (privacy mode)

kb:
  enabled: true
  root: data/kb                     # uploaded files + their incremental index
  default_scope: both               # indexed | uploaded | both (per-request override)

cors_origins: []                    # the web UI origin(s) in production

demo_tokens: false                  # true: the landing page can mint 2-hour demo tokens (AEOS_DEMO_TOKENS=1);
demo_token_hours: 2                 #   never in client mode; the trial allowance still applies
landing_config: configs/landing.yaml

state_backend: sqlite              # sqlite = one API process; redis = several replicas share the
                                    #   rate limiter, trial and usage ledgers and KB job table
redis_url_env: REDIS_URL            # e.g. redis://redis:6379/0 (compose.scale.yaml); AEOS_STATE_BACKEND
                                    #   overrides state_backend
