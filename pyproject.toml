[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litbiorag-v2"
version = "0.0.1"
description = "Evidence-gated biomedical literature RAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
eval = [
    "pandas>=2.2",
    "numpy>=1.26",
    "tabulate>=0.9",
]
index = [
    "tantivy>=0.22",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]
pptx = [
    "python-pptx>=1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]
kb = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]
ml = [
    "torch>=2.2",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
include = ["app*", "models*", "evaluation*"]

[tool.setuptools.package-data]
app = ["web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
