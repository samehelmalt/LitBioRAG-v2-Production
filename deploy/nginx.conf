# Round-robin over the aeos replicas (Docker DNS returns every replica for the service name).
worker_processes 1;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=10s;
  upstream aeos_upstream { server aeos:8471; }
  server {
    listen 8471;
    client_max_body_size 60m;                 # uploads (api.yaml limits.max_upload_mb)
    proxy_read_timeout 300s;                  # long answers and SSE streams
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    location / {
      proxy_pass http://aeos_upstream;
      proxy_buffering off;                    # server-sent events
    }
  }
}
