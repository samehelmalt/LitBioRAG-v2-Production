# AEOS Medical — local test run.  `docker compose up --build`  then open http://localhost:8471
# First start builds a small demo bundle (test doubles, no real model) and prints demo tokens.
# For real models: set PROFILE=hosted and OPENAI_API_KEY in .env, and point CORPUS_ID at a fetched
# bundle under ./data/artifacts (docs/DEPLOYMENT.md). Port 8471 was chosen to avoid 8000/8080/3000.
services:
  aeos:
    build: .
    image: aeos-medical:local
    ports: ["8471:8471"]
    env_file:
      - path: .env
        required: false
    environment:
      LITBIORAG_BUNDLE: /srv/aeos/data/artifacts/${CORPUS_ID:-demo}
      LITBIORAG_MODEL_PROFILE: ${PROFILE:-test}
      LITBIORAG_API_PORT: "8471"
      AEOS_DEMO_TOKENS: "1"            # landing page "Try the live demo" mints 2-hour demo tokens
      AEOS_TRIAL_QUESTIONS: "${AEOS_TRIAL_QUESTIONS:-5}"
    volumes:
      - ./data:/srv/aeos/data
    restart: unless-stopped
    # GPU serving (ml image): uncomment
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }
